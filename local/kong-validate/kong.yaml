services:
  - name: jwks-service
    host: localhost
    port: 1
    protocol: http
    routes:
      - name: jwks-all
        paths:
          - /.well-known/jwks.json
        methods:
          - GET
        strip_path: false
      - name: jwks-keyset
        paths:
          - ~/keysets/(?<key_set>.+)/.well-known/jwks.json
        methods:
          - GET
        strip_path: false
    plugins:
      - name: trust-registry-ai-openspec
