# Main nginx config for the e2e LB ("kong" compose service), mounted at
# /etc/nginx/nginx.conf. Replicates the stock image config (http block
# including conf.d/*.conf, where server.conf lives) and adds a TCP stream
# passthrough on :8443 so TLS terminates at the Kong data planes — required
# for client-certificate verification ($ssl_client_verify) and SNI to be
# computed by Kong itself. This file lives in main/ so the conf.d/*.conf
# glob (fed by the ./local/nginx mount) does not also include it.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # DNS for the scaled kong-dp service resolves to all replicas at config
    # load, giving the same round-robin behavior as the http upstream.
    upstream backend_tls {
        server kong-dp:8443;
    }

    server {
        listen 8443;
        proxy_pass backend_tls;
    }
}
