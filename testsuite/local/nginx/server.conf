# Unbuffered so Playwright can read hits immediately after a probe/plugin request.
log_format capture_hits '$request_uri';

upstream backend {
    server kong-dp:8000;
}

server {
    listen 8000;

    resolver 127.0.0.11 valid=5s;
    
    include /etc/nginx/mime.types;

    # Static test fixtures (signing keys / JWKS). Served by the LB — never via a
    # Kong route (DP would deadlock proxying to itself). See fixtures/README.md.
    location /__fixtures__/ {
        alias /var/fixtures/;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Request-counting JWKS stand-in. Any path under /__capture__/ is logged and
    # served as rsa-2048.jwks.json so "no JWKS request is made" is observable,
    # and a fetch-then-verify regression would return 200 rather than the
    # allowlist 401. See fixtures/README.md.
    location /__capture__/ {
        access_log /var/capture/hits.log capture_hits;
        default_type application/json;
        add_header Cache-Control "no-store";
        root /var/fixtures/keys;
        rewrite ^ /rsa-2048.jwks.json break;
    }

    location / {
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://backend/;
    }
}