name: e2e

networks:
  net: {}

services:
  playwright:
    image: playwright:e2e
    # platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile.playwright
    depends_on:
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
      token-exchange-mock:
        condition: service_healthy
      deck:
        condition: service_completed_successfully
      httpbun:
        condition: service_started
    environment:
      - KONG_ADMIN_URL=http://kong-cp:8001
      - KONG_PROXY_URL=http://kong.localtest.me:8000
      - KONG_PROXY_TLS_URL=https://kong.localtest.me:8443
      # Unique nginx LB hostname for no-SNI IP connect. kong.localtest.me must
      # not be used: it used to also alias kong-cp, which does not listen :8443.
      - KONG_PROXY_TLS_CONNECT_HOST=kong
      - TOKEN_EXCHANGE_MOCK_CAPTURE_URL=http://token-exchange-mock:8080
      - TOKEN_EXCHANGE_MOCK_TOKEN_URL=http://token-exchange-mock:8080/token
      # Playwright baseURL — Admin API (suite also needs KONG_PROXY_URL separately)
      - BASE_URL=http://kong-cp:8001
      - KONG_VERSION=${KONG_VERSION:-3.9.1}
    volumes:
      - ./playwright-report:/e2e-playwright/playwright-report
      - ./playwright-results:/e2e-playwright/playwright-results
      - ./local/kong/fixtures:/e2e-playwright/local/kong/fixtures
    networks:
      - net
    profiles: ["tests"]

  httpbun:
    image: sharat87/httpbun
    networks:
      net:
        aliases:
          - upstream.localtest.me

  token-exchange-mock:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "mock-server.mjs"]
    volumes:
      - ./local/token-exchange:/app:ro
    ports:
      - "18080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s
    networks:
      - net

  kong-cp:
    image: kong:e2e
    env_file:
      - ./local/kong/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      kong-session-store:
        condition: service_started
      kong-migrations-up:
        condition: service_completed_successfully
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    ports:
      - 8001:8001
      - 8005:8005
    networks:
      - net
    healthcheck:
      test: ["CMD", "/tmp/kong/health"]
      interval: 10s
      timeout: 5s
      retries: 4

  kong:
    image: nginx:latest
    ports:
      - "8000:8000"
      # TLS passthrough to the Kong DPs (mTLS entry point)
      - "8443:8443"
    volumes:
      - ./local/nginx:/etc/nginx/conf.d
      # Main config adds a stream{} passthrough :8443 -> kong-dp:8443
      - ./local/nginx/main/nginx.conf:/etc/nginx/nginx.conf:ro
      # Reachable JWKS / key fixtures at http://kong:8000/__fixtures__/…
      - ./local/kong/fixtures:/var/fixtures:ro
      # Writable overlay: nginx access-log for /__capture__/ (parent is :ro).
      - ./local/kong/fixtures/capture:/var/capture
    depends_on:
      kong-dp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 4
    networks:
      net:
        aliases:
          - kong.localtest.me

  kong-dp:
    deploy:
      replicas: 3
    image: kong:e2e
    env_file:
      - ./local/kong/.env.dp.local
    depends_on:
      kong-cp:
        condition: service_healthy
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    healthcheck:
      test: ["CMD", "/tmp/kong/health"]
      interval: 10s
      timeout: 5s
      retries: 4
    networks:
      - net

  deck:
    image: kong/deck:latest
    depends_on:
      kong:
        condition: service_healthy
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    restart: no
    command:
      - gateway
      - --kong-addr
      - http://kong-cp:8001
      - sync
      - /tmp/kong/kong.yaml
    networks:
      - net

  postgres:
    image: postgres:17
    #    platform: linux/amd64
    container_name: db
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/1-init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - net

  kong-migrations:
    image: kong:e2e
    build:
      # context up a level so that the Dockerfile can pull in plugin source
      context: ../.
      args:
        - KONG_VERSION=${KONG_VERSION:-3.9.1}
    # platform: linux/amd64 # Needed for 3.8.5 if on Apple silicon
    command: kong migrations bootstrap
    volumes:
      - ./local/kong:/tmp/kong
    env_file:
      - ./local/kong/.env.local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net

  kong-migrations-up:
    image: kong:e2e
    command: kong migrations up && kong migrations finish
    volumes:
      - ./local/kong:/tmp/kong
    env_file:
      - ./local/kong/.env.local
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    networks:
      - net

  kong-session-store:
    image: redis:latest
    container_name: kong-session-store
    networks:
      - net
