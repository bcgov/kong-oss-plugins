name: e2e

networks:
  net: {}

services:
  playwright:
    image: playwright:e2e
    # platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile.playwright
    depends_on:
      keycloak:
        condition: service_healthy
      kong:
        condition: service_healthy
      deck:
        condition: service_completed_successfully
      httpbun:
        condition: service_started
    environment:
      - KONG_ADMIN_URL=http://kong-cp:8001
      - KONG_PROXY_URL=http://kong.localtest.me:8000
      # Playwright baseURL — Admin API (suite also needs KONG_PROXY_URL separately)
      - BASE_URL=http://kong-cp:8001
      - KONG_VERSION=${KONG_VERSION:-3.9.1}
    volumes:
      - ./playwright-report:/e2e-playwright/playwright-report
      - ./playwright-results:/e2e-playwright/playwright-results
      - ./local/kong/fixtures:/e2e-playwright/local/kong/fixtures
    networks:
      - net
    profiles: ["tests"]

  httpbun:
    image: sharat87/httpbun
    networks:
      net:
        aliases:
          - upstream.localtest.me

  kong-cp:
    image: kong:e2e
    env_file:
      - ./local/kong/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      kong-session-store:
        condition: service_started
      kong-migrations-up:
        condition: service_completed_successfully
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    ports:
      - 8001:8001
      - 8005:8005
    networks:
      net:
        aliases:
          - kong.localtest.me
    healthcheck:
      test: ["CMD", "/tmp/kong/health"]
      interval: 10s
      timeout: 5s
      retries: 4

  kong:
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./local/nginx:/etc/nginx/conf.d
      # Reachable JWKS / key fixtures at http://kong:8000/__fixtures__/…
      - ./local/kong/fixtures:/var/fixtures:ro
    depends_on:
      kong-dp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 4
    networks:
      net:
        aliases:
          - kong.localtest.me

  kong-dp:
    deploy:
      replicas: 3
    image: kong:e2e
    env_file:
      - ./local/kong/.env.dp.local
    depends_on:
      kong-cp:
        condition: service_healthy
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    healthcheck:
      test: ["CMD", "/tmp/kong/health"]
      interval: 10s
      timeout: 5s
      retries: 4
    networks:
      - net

  deck:
    image: kong/deck:latest
    depends_on:
      kong:
        condition: service_healthy
    environment: []
    volumes:
      - ./local/kong:/tmp/kong
    restart: no
    command:
      - gateway
      - --kong-addr
      - http://kong-cp:8001
      - sync
      - /tmp/kong/kong.yaml
    networks:
      - net

  postgres:
    image: postgres:17
    #    platform: linux/amd64
    container_name: db
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/1-init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - net

  kong-migrations:
    image: kong:e2e
    build:
      # context up a level so that the Dockerfile can pull in plugin source
      context: ../.
      args:
        - KONG_VERSION=${KONG_VERSION:-3.9.1}
    # platform: linux/amd64 # Needed for 3.8.5 if on Apple silicon
    command: kong migrations bootstrap
    volumes:
      - ./local/kong:/tmp/kong
    env_file:
      - ./local/kong/.env.local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net

  kong-migrations-up:
    image: kong:e2e
    command: kong migrations up && kong migrations finish
    volumes:
      - ./local/kong:/tmp/kong
    env_file:
      - ./local/kong/.env.local
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    networks:
      - net

  kong-session-store:
    image: redis:latest
    container_name: kong-session-store
    networks:
      - net
