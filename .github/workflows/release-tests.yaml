name: Release tooling tests
on:
  pull_request: {}
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/release -v
