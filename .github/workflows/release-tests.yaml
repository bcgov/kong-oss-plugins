name: Release tooling tests
on:
  pull_request: {}
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global semver@7.7.3
      - run: bash tests/release.sh
