name: Plugin Tests

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main", "feature/*"]

env:
  GIT_COMMIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  GIT_COMMIT_AUTHOR: ${{ github.actor }}
  GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GIT_REPO_URL: ${{ github.repository }}
  KONG_VERSION: "3.9.1"
  KC_VERSION: "26.5.3"

jobs:
  build-busted-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # docker buildx GHA cache
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List plugins with busted specs
        id: plugins
        shell: bash
        run: |
          set -euo pipefail
          plugins="$(
            find plugins -mindepth 3 -maxdepth 3 -name '*_spec.lua' \
              | sed -E 's|plugins/([^/]+)/.*|\1|' \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "busted plugins: $plugins"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kong:busted
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.busted
          build-args: |
            KONG_VERSION=${{ env.KONG_VERSION }}
          tags: kong:busted
          load: true
          cache-from: type=gha,scope=kong-busted
          cache-to: type=gha,mode=max,scope=kong-busted

      - name: Save image
        run: docker save kong:busted | gzip > kong-busted.tar.gz

      - name: Upload kong:busted image
        uses: actions/upload-artifact@v4
        with:
          name: kong-busted-image
          path: kong-busted.tar.gz
          retention-days: 1

  busted:
    needs: build-busted-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.build-busted-image.outputs.plugins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kong:busted image
        uses: actions/download-artifact@v4
        with:
          name: kong-busted-image

      - name: Load image
        run: gunzip -c kong-busted.tar.gz | docker load

      - name: Run busted for ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)":/work \
            -w "/work/plugins/${{ matrix.plugin }}" \
            -u root \
            kong:busted \
            sh -c 'luarocks make && busted'

  plugin-tests:
    strategy:
      fail-fast: false
      matrix:
        kong: ["3.9.1"]
        keycloak: ["26.5.3"]

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Images
        working-directory: testsuite
        run: |
          KC_VERSION=${{ matrix.keycloak }} \
          KONG_VERSION=${{ matrix.kong }} \
          docker compose \
            --profile tests \
            -f docker-compose.yml \
            -f docker-compose-keycloak.yml \
            build

      - name: Spin up Kong stack
        working-directory: testsuite
        run: |
          export CI=true
          KONG_VERSION=${{ matrix.kong }} \
          KC_VERSION=${{ matrix.keycloak }} \
          docker compose \
            -f docker-compose.yml \
            -f docker-compose-keycloak.yml \
            up -d

      - name: Run Playwright tests
        working-directory: testsuite
        run: |
          set -euo pipefail
          export CI=true
          docker compose \
            -f docker-compose.yml \
            -f docker-compose-keycloak.yml \
            logs -f 2>&1 &
          LOG_PID=$!

          set +e
          KONG_VERSION=${{ matrix.kong }} \
          KC_VERSION=${{ matrix.keycloak }} \
          docker compose --profile tests \
            -f docker-compose.yml \
            -f docker-compose-keycloak.yml \
            run --rm playwright
          STATUS=$?
          set -e

          kill "$LOG_PID" 2>/dev/null || true
          exit "$STATUS"

      - name: Tear down stack
        if: always()
        working-directory: testsuite
        run: |
          docker compose --profile tests \
            -f docker-compose.yml \
            -f docker-compose-keycloak.yml \
            down || true

      - name: Upload E2E Test Results HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kong-${{ matrix.kong }}-keycloak-${{ matrix.keycloak }}-results-html
          path: ${{ github.workspace }}/testsuite/playwright-report/index.html

      - name: Upload E2E Test Results JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kong-${{ matrix.kong }}-keycloak-${{ matrix.keycloak }}-results-json
          path: ${{ github.workspace }}/testsuite/playwright-results/test-results.json

      - name: Check for failed tests and report results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULTS="${{ github.workspace }}/testsuite/playwright-results/test-results.json"
          if [[ ! -f "$RESULTS" ]]; then
            echo "No Playwright JSON results found at $RESULTS"
            exit 1
          fi

          FAILURE_COUNT=$(jq '.stats.unexpected' "$RESULTS")
          echo "Fail count ${FAILURE_COUNT}"
          if [[ "$FAILURE_COUNT" -gt 0 ]]; then
            FAILED_TESTS=$(jq -r '
              .. | .specs? // empty |
              .[] |
              select(.ok == false) |
              "- " + .file + " - " + .title
            ' "$RESULTS")
            STATS=$(jq -r '.stats | to_entries | map("\(.key)\t\(.value)") | .[]' "$RESULTS" | column -t)
            RUN_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BRANCH="${{ github.head_ref || github.ref_name }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            else
              COMMIT_SHA="${{ github.sha }}"
            fi
            SHORT_SHA="${COMMIT_SHA:0:7}"
            MATRIX_LABEL="kong-${{ matrix.kong }} keycloak-${{ matrix.keycloak }}"
            {
              echo "## Playwright E2E tests failed ($FAILURE_COUNT) — \`$MATRIX_LABEL\`"
              echo ""
              echo "**Branch:** \`$BRANCH\` | **Commit:** \`$SHORT_SHA\`"
              echo ""
              echo "<details>"
              echo "<summary>Stats</summary>"
              echo ""
              echo '```'
              echo "$STATS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              if [[ "$FAILURE_COUNT" -gt 10 ]]; then
                echo "<details>"
                echo "<summary>Failed tests ($FAILURE_COUNT)</summary>"
                echo ""
                echo "$FAILED_TESTS"
                echo ""
                echo "</details>"
              else
                echo "### Failed tests ($FAILURE_COUNT)"
                echo ""
                echo "$FAILED_TESTS"
              fi
              echo ""
              echo "[View workflow run]($RUN_LINK)"
            } > msg
            export MSG=$(cat msg)
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "$MSG"
            else
              gh issue create \
                --title "FAILED: [$MATRIX_LABEL] Automated Tests ($FAILURE_COUNT)" \
                --body "$MSG" \
                --label "automation" \
                --assignee "${{ env.GIT_COMMIT_AUTHOR }}"
            fi
            exit 1
          fi
