name: Release policy
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global semver@7.7.3
      - run: bash .github/scripts/release-plan.sh
      - name: Summarize planned releases
        run: |
          echo '### Component release plan' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.tag)"' release-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: release-plan.json
